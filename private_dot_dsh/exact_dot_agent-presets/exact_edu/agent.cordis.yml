# The `edu` agent preset: 教学专用（解析几何 / 立体几何 / 语文作文等）。
#
# 迁移自 opencode 的 `edu` agent：只暴露教育类 Skills，其余一律不暴露。
# 在 dsh 中通过 skill-filesystem 的 customSkillDirs + includeDefaultRoots:false
# 把 Skill 目录限定为 7 个教学 skill，等价于 opencode 的 permission.skill 白名单。
#
# 本预设保留文件读写（生成交互教学网页）、网页检索、Skills、计划模式；
# 不挂 bash/子代理/工作流——教学场景不需要。
#
# 结构遵循 standard preset 的约定：
# - 需要 realm 的服务行放入 `cordis:group` + `isolate` 组
# - 注册进 host 注册表的工具行（tool-fs 等）直接在顶层

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一名中文教学 Agent，负责解析几何、立体几何、语文八股作文等学科的教学与出题。
      你的工作目录是 {{cwd}}。请用中文与用户交流，讲解要细致、循序渐进、图文并茂。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem（生成交互教学网页需要）───────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills（教学核心：仅 7 个教学 skill）─────────────────────────────────────
#
# skill 注册表在 host 组成中且按 scope 分层：这些行注册进本预设自己的层。
# includeDefaultRoots:false 关闭所有默认 skill 根（项目/用户/内置），只保留
# customSkillDirs 里的教学 skill，等价于 opencode 的"*: deny + 白名单"。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /var/home/chen/.agents/skills/0edu
      - /var/home/chen/.agents/skills/0enhance/max-research
      - /var/home/chen/.agents/skills/0enhance/self-reflection
      - /var/home/chen/.agents/skills/notepad
      - /var/home/chen/.agents/skills/0workflow/qu-ai-wei

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── web 检索 ─────────────────────────────────────────────────────────────────

# web 服务与 search provider 在 host 组成中；这里只挂模型侧工具。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 交互（向用户提问、待办）──────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── 计划模式 ────────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Plan the teaching content, the interactive page structure, and the proof/answer steps before executing.

# ── compaction（上下文管理）──────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
