# dsh-webui-fix-pack bundle layer: installs the dsh webui fix plugins that are
# still needed (upstream-superseded legacy fixes are opt-in via single install).
# Override individual plugins in your profile's later cordis.patch.yml by id.
- insert:
    - id: double-enter-to-steer
      name: '@jiesou/dsh-webui-fix-double-enter-to-steer'
    - id: hide-like-dislike
      name: '@jiesou/dsh-webui-fix-hide-like-dislike'
    - id: hide-session-log
      name: '@jiesou/dsh-webui-fix-hide-session-log-btn'
    - id: mobile-enter-newline
      name: '@jiesou/dsh-webui-fix-mobile-enter-newline'
    - id: mobile-keyboard-blur
      name: '@jiesou/dsh-webui-fix-mobile-keyboard-blur'
    - id: subagent-panel
      name: '@jiesou/dsh-webui-fix-subagent-panel'
    - id: pwa
      name: '@jiesou/dsh-webui-fix-pwa'
    - id: session-row-context-menu
      name: '@jiesou/dsh-webui-fix-session-row-context-menu'
    - id: ime-multiline-commit
      name: '@jiesou/dsh-webui-fix-ime-multiline-commit'
