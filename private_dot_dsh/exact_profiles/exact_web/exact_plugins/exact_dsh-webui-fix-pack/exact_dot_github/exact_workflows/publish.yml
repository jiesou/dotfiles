name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing / OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Typecheck, build and publish
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          for dir in plugins/*/ bundles/*/; do
            [ -f "$dir/package.json" ] || continue
            echo "=== $dir ==="
            (cd "$dir" && npm run typecheck --if-present && npm run build --if-present) || { failed+=("$dir(typecheck/build)"); continue; }
            if output="$(cd "$dir" && npm publish --provenance --access public 2>&1)"; then
              echo "published $dir"
            elif grep -Eq 'EPUBLISHCONFLICT|previously published versions|previously staged version' <<<"$output"; then
              echo "skip $dir: version already exists"
            else
              echo "publish failed for $dir:"
              echo "$output"
              if grep -Eq 'E404|404 Not Found - PUT' <<<"$output"; then
                echo "hint: '$dir' looks like a first-time publish rejected by npm Trusted Publishing."
                echo "hint: add a Pending Trusted Publisher for this package on npmjs.com,"
                echo "      or run 'npm publish' once locally with a classic token, then re-run this workflow."
              fi
              failed+=("$dir")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "FAILED: ${failed[*]}"
            exit 1
          fi