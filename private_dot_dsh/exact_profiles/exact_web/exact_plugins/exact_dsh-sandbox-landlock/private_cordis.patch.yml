# Disable stock providers; mount Landlock for bash and fs-tool.
- id: sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- insert:
    - id: sandbox-landlock
      name: dsh-sandbox-landlock
      config:
        writeDirs:
          - ~/.dsh
          - ~/.agents
          - /var/home/linuxbrew/.linuxbrew/lib/node_modules/@deepseek-ai
          - ~/.mcp-auth
          - ~/.cache/opencode
          - ~/.local/share/opencode
          - ~/.local/share/Trash
          - ~/Downloads
          - ~/Documents/dev/.blog
          - ~/Documents/dev/Android
          - ~/Documents/dev/AppImages
          - ~/Documents/dev/blender
          - ~/Documents/dev/mcps
          - ~/.ssh
          - /etc/ssh
          - ~/.config/systemd/user
          - /etc/systemd
          - ~/.cache
          - ~/.local/bin
          - ~/.npm
          - ~/.bun
          - ~/.local/share/pnpm
          - ~/.local/share/uv
          - ~/.gradle
          - ~/.m2
          - ~/.android
          - ~/.platformio
          - ~/.espressif
          - ~/.arduino15
          # 串口等设备节点：通配符在每条命令 confine 时展开（Landlock 规则绑 inode，
          # 拔插后下一条命令自动重新授权；设备缺席自动剔除，不会触发 launcher exit 125）
        devicePaths:
          - /dev/ttyUSB*
          - /dev/ttyACM*
          # pty：没有它，沙箱内任何要开伪终端的程序（tmux、script、expect、
          # pty.fork）都会在 openpty 处吃 EACCES，看着像“禁止创建进程”。
          # /dev/ptmx 本身 0666；/dev/pts/* 归当前会话用户。
          - /dev/ptmx
          - /dev/pts/*
          # GPU 加速：VA-API / EGL / Vulkan 只需 render node（udev 建为 0666，全球可读写）。
          # card* 是 DRM master、能接管显示，不在此列。
          - /dev/dri/renderD*

