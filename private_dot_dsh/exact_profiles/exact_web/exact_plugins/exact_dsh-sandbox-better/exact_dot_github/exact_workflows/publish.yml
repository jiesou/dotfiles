name: Publish to npm

# lib/ is committed (that is what makes `github:` one-line installs work), and
# .githooks/pre-push rebuilds it before a version tag leaves the machine, so CI
# only publishes the tagged tree.
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*' # pnpm version tags with a v prefix; the hook accepts both
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing / OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        shell: bash
        run: |
          set -uo pipefail
          output="$(npm publish --provenance --access public 2>&1)" && status=0 || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "published"
          elif grep -Eq 'EPUBLISHCONFLICT|previously published versions|previously staged version' <<<"$output"; then
            echo "skip: version already exists"
          else
            echo "publish failed"
            exit 1
          fi
