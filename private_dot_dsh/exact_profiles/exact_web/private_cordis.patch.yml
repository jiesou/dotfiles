# Web-profile patch layer. MCP servers live in ~/.dsh/cordis.patch.yml
# (machine-global); the MCP Manager panel edits that file via patchFile below.
# The /api browser-trust fence reads trustedHosts from the `connection` row
# (populated from `ctx.webStartup.trustedHosts`). A trustedHosts key on
# web-runtime is dead config and no longer admits anything.
- id: connection
  config:
    trustedHosts:
      - chenpc.lan
      - hp-book.lan
      - hp-book
      # 裸 IP 访问的授权(dsh 绑 loopback,socat 投放到局域网;LAN IP 变了改这里)
      - 192.168.11.192
- insert:
    - id: tool-deny
      name: dsh-tool-deny
      config:
        denyTools:
          # 只留 mcp__tinyfish__search 与 mcp__tinyfish__fetch_content，其余 MCP 工具
          # 一律不可见。停用中的 server（linkup / firecrawl / tavily）保留名字：
          # 重新启用时其工具一注册就自动补掩码。
          - mcp__linkup__linkup-research
          - mcp__linkup__linkup-get-research
          - mcp__firecrawl__firecrawl_parse
          - mcp__firecrawl__firecrawl_map
          - mcp__firecrawl__firecrawl_crawl
          - mcp__tavily__tavily_map
          - mcp__tavily__tavily_crawl
          - mcp__tavily__tavily_research
          - mcp__tinyfish__top_up_wallet
          - mcp__tinyfish__batch_cancel
          - mcp__tinyfish__batch_status
          - mcp__tinyfish__cancel_monitor
          - mcp__tinyfish__cancel_profile_setup_session
          - mcp__tinyfish__cancel_run
          - mcp__tinyfish__close_browser_session
          - mcp__tinyfish__create_browser_session
          - mcp__tinyfish__create_monitor
          - mcp__tinyfish__create_profile
          - mcp__tinyfish__get_monitor
          - mcp__tinyfish__get_run
          - mcp__tinyfish__get_search_usage
          - mcp__tinyfish__get_wallet
          - mcp__tinyfish__guide_next_step
          - mcp__tinyfish__list_browser_sessions
          - mcp__tinyfish__list_fetch_usage
          - mcp__tinyfish__list_monitors
          - mcp__tinyfish__list_profiles
          - mcp__tinyfish__list_runs
          - mcp__tinyfish__pause_monitor
          - mcp__tinyfish__resume_monitor
          - mcp__tinyfish__run_monitor
          - mcp__tinyfish__run_web_automation
          - mcp__tinyfish__run_web_automation_async
          - mcp__tinyfish__save_profile_setup_session
          - mcp__tinyfish__start_profile_setup_session
          - mcp__tinyfish__cancel_deep_research
          - mcp__tinyfish__get_deep_research
          - mcp__tinyfish__start_deep_research
    - id: subagent-background-only
      name: 'dsh-subagent-background-only'
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('search.db')
    openAt: startup
- id: agent-default-model
