# Web-profile patch layer. MCP servers live in ~/.dsh/cordis.patch.yml
# (machine-global); the MCP Manager panel edits that file via patchFile below.
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080
- id: web-runtime
  inject: [webStartup]
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    trustedHosts:
      - chenpc.lan
- id: mcp-manager
  config:
    patchFile: /home/chen/.dsh/cordis.patch.yml
- insert:
    - id: tool-deny
      name: dsh-tool-deny
      config:
        denyTools: []
- id: ui-chat-recovery
  disabled: true

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('search.db')
    openAt: startup
- id: dsh-context
  disabled: true
