# Web-profile patch layer. MCP servers live in ~/.dsh/cordis.patch.yml
# (machine-global); the MCP Manager panel edits that file via patchFile below.
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080
- id: web-runtime
  inject: [webStartup]
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    trustedHosts:
      - chenpc.lan
- id: mcp-manager
  config:
    patchFile: /home/chen/.dsh/cordis.patch.yml
- insert:
    - id: tool-deny
      name: dsh-tool-deny
      config:
        denyTools:
          - mcp__linkup__linkup-research
          - mcp__linkup__linkup-get-research
          - mcp__firecrawl__firecrawl_parse
          - mcp__firecrawl__firecrawl_map
          - mcp__firecrawl__firecrawl_crawl
          - mcp__tavily__tavily_map
          - mcp__tavily__tavily_crawl
          - mcp__tavily__tavily_research
          - mcp__tinyfish__get_search_usage
          - mcp__tinyfish__get_fetch_usage
          - mcp__tinyfish__get_wallet
          - mcp__tinyfish__list_fetch_usage
          - mcp__tinyfish__list_search_usage
          - mcp__tinyfish__list_runs
          - mcp__tinyfish__get_run
          - mcp__tinyfish__batch_status
          - mcp__tinyfish__batch_cancel
          - mcp__tinyfish__cancel_run
          - mcp__tinyfish__run_web_automation_async
          - mcp__tinyfish__list_browser_sessions
          - mcp__tinyfish__create_browser_session
          - mcp__tinyfish__close_browser_session
          - mcp__tinyfish__run_web_automation
          - mcp__tinyfish__guide_next_step
- id: ui-chat-recovery
  disabled: true

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('search.db')
    openAt: startup
- id: dsh-context
  disabled: true
