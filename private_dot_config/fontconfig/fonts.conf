<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
<!-- TKS: https://szclsya.me/zh-cn/posts/fonts/linux-config-guide -->
<!-- TKS: https://github.com/szclsya/dotfiles/blob/master/fontconfig/fonts.conf -->
<!-- TKS: https://wiki.archlinux.org/title/Font_configuration/Chinese -->
  <match target="font">
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintslight</const>
    </edit>
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
  </match>

  <!-- Map fonts that are commonly used by web pages to our preferred fonts -->
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="prepend" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>serif</string></edit>
  </match>
  <!-- Fix for jlc.com -->
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>microsoft yahei ui</string></test>
    <edit name="family" mode="prepend" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <!-- Fix for cnblogs.com -->
  <match target="pattern">
    <test qual="any" name="family"><string>Courier New</string></test>
    <edit name="family" mode="prepend" binding="same"><string>monospace</string></edit>
  </match>
  <!-- Fix for qwen.ai -->
  <match target="pattern">
    <test qual="any" name="family"><string>SF Mono</string></test>
    <edit name="family" mode="prepend" binding="same"><string>monospace</string></edit>
  </match>
  <!-- Fix for Adwaita -->
  <match target="pattern">
    <test qual="any" name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="prepend" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Adwaita Mono</string></test>
    <edit name="family" mode="prepend" binding="same"><string>monospace</string></edit>
  </match>

  <!-- system-ui as an alias for sans-serif -->
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>
  <!-- Fallback fonts preference order -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Source Code Pro Medium</family>
      <family>Sarasa Term SC</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
      <family>math</family>
      <prefer>
        <family>STIX Two Math</family>
        <family>DejaVu Math TeX Gyre</family>
        <family>Noto Color Emoji</family>
        <family>Noto Emoji</family>
      </prefer>
  </alias>

  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family" >
          <!-- This font is causing problem with GitHub -->
          <string>Nimbus Sans</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
  <!-- Fix for 65-1-google-noto-sans-cjk-fonts.conf prepending Noto Sans CJK SC
       to sans-serif when LANG=zh_CN, overriding Adwaita Sans preference -->
  <match>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Adwaita Sans</string></edit>
  </match>
</fontconfig>
