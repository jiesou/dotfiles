set -g mouse on
set -g set-clipboard off

setw -g mode-keys vi
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g history-limit 10000

set -g escape-time 10
set -g display-time 2000
set -g status-interval 5

bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind -n M-Left previous-window
bind -n M-Right next-window

set -g status-style fg=white,bg=#222222
set -g status-left "#[fg=#00ff00,bg=#333333] #S #[default]"
set -g status-left-length 40
set -g status-right "#[fg=#aaaaaa,bg=#333333] %Y-%m-%d %H:%M #[default]"
set -wg window-status-format " #I:#W "
set -wg window-status-current-format "#[fg=black,bg=#00ff00] #I:#W #[default]"
set -wg window-status-separator ""

